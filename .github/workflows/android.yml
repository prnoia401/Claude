name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuestRemote-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuestRemote-${{ github.run_number }}
          path: QuestRemote-${{ github.run_number }}.apk

      # Отдельный релиз на каждую сборку: APK можно скачать прямо с телефона
      # со страницы Releases, без входа в GitHub Actions.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quest Remote build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: QuestRemote-${{ github.run_number }}.apk
          body: |
            Тестовая сборка из ветки `${{ github.ref_name }}` (${{ github.sha }}).
            Установка: `adb install -r QuestRemote-${{ github.run_number }}.apk` или скачать файл на телефон и открыть.
