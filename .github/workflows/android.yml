name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint (API compatibility)
        run: ./gradlew --no-daemon lintDebug

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QuestRemote-${{ github.run_number }}.apk
          cp client/build/outputs/apk/debug/client-debug.apk QuestRemoteClient-${{ github.run_number }}.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.*
            client/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: QuestRemote-${{ github.run_number }}
          path: QuestRemote*-${{ github.run_number }}.apk

      # Отдельный релиз на каждую сборку: APK можно скачать прямо с телефона
      # со страницы Releases, без входа в GitHub Actions.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quest Remote build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            QuestRemote-${{ github.run_number }}.apk
            QuestRemoteClient-${{ github.run_number }}.apk
          body: |
            Тестовая сборка из ветки `${{ github.ref_name }}` (${{ github.sha }}).
            Телефон: `adb install -r QuestRemote-${{ github.run_number }}.apk` (или скачать файл на телефон и открыть).
            Клиент для шлема вшит в пульт (вкладка «Пульт» → «Установить клиент на шлем»); отдельный файл: QuestRemoteClient-${{ github.run_number }}.apk.

  # Сквозные тесты на эмуляторе Android 11 (API 30): настоящий adbd, клиент, плеер, интерфейс.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/e2e.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_number }}
          path: |
            /tmp/instrument.txt
            /tmp/logcat.txt
          if-no-files-found: ignore

